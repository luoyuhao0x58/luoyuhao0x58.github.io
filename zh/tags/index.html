<!DOCTYPE html><html lang="zh-CN" dir="ltr"><head><!-- 主题初始化脚本:必须放在 <head>,在首帧前应用 data-theme,避免主题闪烁。
     三种状态:light / dark / auto。auto 不是“无属性跟随系统”了:部分国产 WebView
     不报告 prefers-color-scheme 媒体查询(CSS 的 @media 块不生效),故 auto 用 JS
     matchMedia 显式检测系统深/浅并直接设 data-theme;matchMedia 不可用时才回退
     到无属性 + CSS 媒体查询兑底。与 ThemeToggle.astro 的按钮配合,用事件委托处理点击。 --><script>
  (function () {
    const KEY = "nettix-theme";
    const ORDER = ["light", "dark", "auto"];
    const ICONS = { light: "☀️", dark: "🌙", auto: "🔄" };


    function current() {
      // 读 data-theme-state(用户真实选择)而非 data-theme:auto 状态下会显式设
      // data-theme=dark(系统检测结果),若读 data-theme 会被误判为 dark,手动循环到不了 light。
      const s = document.documentElement.getAttribute("data-theme-state");
      return s === "light" || s === "dark" || s === "auto" ? s : "auto";
    }
    // 系统深色检测:部分国产 WebView 不报告 prefers-color-scheme 媒体查询
    // (CSS 的 @media 块不生效),这里用 JS matchMedia 显式检测并设 data-theme 绕开。
    function systemPrefersDark() {
      try {
        return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      } catch {
        return false;
      }
    }
    function setState(t) {
      const root = document.documentElement;
      if (t === "auto") {
        // auto:JS 显式检测系统主题;matchMedia 不可用(极老 WebView)时移除属性,
        // 交回 CSS @media prefers-color-scheme 兑底(都不支持则保持浅色)。
        if (systemPrefersDark()) root.setAttribute("data-theme", "dark");

      try {
        localStorage.setItem(KEY, t);
      } catch {

      }
      root.setAttribute("data-theme-state", t);
    }
    // 系统主题变化实时同步(auto 状态下切换设备深/浅色)。
    (function watchSystem() {
      try {
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        const onChange = function () {
          if (current() === "auto") setState("auto");
        };
        if (mq && typeof mq.addEventListener === "function") mq.addEventListener("change", onChange);
        else if (mq && typeof mq.addListener === "function") mq.addListener(onChange);
      } catch {
        /* matchMedia unavailable */
      }
    })();
    function updateButton() {
      const btn = document.getElementById("theme-toggle");
      if (!btn) return;
      const t = current();
      const icon = btn.querySelector("[data-theme-icon]");
      const label = btn.querySelector("[data-theme-label]");
      if (icon) icon.textContent = ICONS[t] || "🔄";
      if (label) {
        const key = "label" + t.charAt(0).toUpperCase() + t.slice(1);
        label.textContent = btn.dataset[key] || t;
      }
      btn.setAttribute("data-theme-state", t);
    }

    let saved = "auto";
    try {
      saved = localStorage.getItem(KEY) || "auto";
    } catch {
      /* localStorage unavailable (private mode / blocked); fall back to auto. */
    }
    setState(saved);

    document.addEventListener("DOMContentLoaded", updateButton);
    // View Transitions 导航完成后重新同步:换页时 DOMContentLoaded 不会再次触发,
    // 若 head 内脚本重跑时序不可控,这里兜底保证主题与按钮状态一致。
    document.addEventListener("astro:page-load", function () {
      let saved = "auto";
      try {
        saved = localStorage.getItem(KEY) || "auto";
      } catch {
        /* ignore */
      }
      setState(saved);
      updateButton();
    });
    // View Transitions swap 会用新页面的 <html> 属性覆盖 documentElement,
    // 而新页面是构建期生成的、不带 data-theme -> 主题瞬间丢失(系统深色时闪黑夜)。
    // after-swap 在 DOM 替换后、动画渲染前同步触发,立即恢复 localStorage 主题。
    document.addEventListener("astro:after-swap", function () {
      let saved = "auto";
      try {
        saved = localStorage.getItem(KEY) || "auto";
      } catch {
        /* ignore */
      }
      setState(saved);
      updateButton();
    });
    document.addEventListener("click", function (e) {
      const el = e.target && e.target.closest ? e.target.closest("#theme-toggle") : null;
      if (!el) return;
      setState(ORDER[(ORDER.indexOf(current()) + 1) % ORDER.length]);
      updateButton();
    });
  })();
